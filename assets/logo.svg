<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="The SMART Modern Public School emblem — Quest for Excellence">
  <defs>
    <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1e4fd8"/><stop offset="1" stop-color="#0b2a6f"/></linearGradient>
    <linearGradient id="rb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9a3d"/><stop offset="1" stop-color="#f26a00"/></linearGradient>
  </defs>
  <circle cx="120" cy="120" r="116" fill="#fff"/>
  <circle cx="120" cy="120" r="110" fill="none" stroke="#dbe6ff" stroke-width="4"/>
  <!-- laurels -->
  <g fill="#1e4fd8" opacity=".85">
    <g id="lf"><ellipse cx="40" cy="150" rx="5" ry="11" transform="rotate(-35 40 150)"/><ellipse cx="34" cy="128" rx="5" ry="11" transform="rotate(-15 34 128)"/><ellipse cx="34" cy="105" rx="5" ry="11" transform="rotate(5 34 105)"/><ellipse cx="40" cy="83" rx="5" ry="11" transform="rotate(25 40 83)"/><ellipse cx="52" cy="168" rx="5" ry="11" transform="rotate(-55 52 168)"/></g>
    <use href="#lf" transform="translate(240 0) scale(-1 1)"/>
  </g>
  <!-- shield -->
  <path d="M120 28 L182 46 V118 C182 160 156 186 120 202 C84 186 58 160 58 118 V46 Z" fill="url(#sh)" stroke="#fff" stroke-width="4"/>
  <path d="M64 58 H176 V96 H64 Z" fill="#fff"/>
  <text x="120" y="70" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="10" fill="#0b2a6f">THE</text>
  <text x="120" y="82" text-anchor="middle" font-family="Arial Black,Arial,sans-serif" font-weight="900" font-size="11.5" fill="#0b2a6f">SMART MODERN</text>
  <text x="120" y="93" text-anchor="middle" font-family="Arial,sans-serif" font-weight="700" font-size="9.5" fill="#1e4fd8">Public School</text>
  <!-- book + child + star -->
  <path d="M84 156 C100 148 112 150 120 156 C128 150 140 148 156 156 V164 C140 157 128 158 120 164 C112 158 100 157 84 164 Z" fill="#fff"/>
  <circle cx="120" cy="116" r="8" fill="#fff"/>
  <path d="M120 125 L112 150 H128 Z" fill="#fff"/>
  <path d="M116 130 L98 112 M124 130 L142 108" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <path d="M146 100 l3.5 7 7.7 1.1-5.6 5.4 1.3 7.7-6.9-3.6-6.9 3.6 1.3-7.7-5.6-5.4 7.7-1.1z" fill="#ffc93c"/>
  <!-- ribbon -->
  <path d="M30 170 L52 162 L48 176 L54 190 L28 186 L36 178 Z" fill="#c95400"/>
  <path d="M210 170 L188 162 L192 176 L186 190 L212 186 L204 178 Z" fill="#c95400"/>
  <path d="M46 166 Q120 180 194 166 L194 188 Q120 202 46 188 Z" fill="url(#rb)" stroke="#fff" stroke-width="2"/>
  <text x="120" y="187" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-weight="800" font-size="11" fill="#fff" letter-spacing=".6">QUEST FOR EXCELLENCE</text>
</svg>
